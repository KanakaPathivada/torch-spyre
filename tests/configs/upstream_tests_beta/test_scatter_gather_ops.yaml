test_suite_config:
  files:
    - path: ${TORCH_ROOT}/test/test_scatter_gather_ops.py
      unlisted_test_mode: skip
      tests:
        # This file tests scatter and gather operations exclusively.
        # All 16 inference tests are listed below, grouped by operation.
        # test_gather_backward_with_empty_index_tensor is intentionally not listed:
        # it is a training test (.backward() call) and unlisted_test_mode: skip
        # ensures it is automatically excluded without needing an explicit skip entry.

        # torch.gather
        # Reads src values at positions specified by an index tensor.
        # mandatory_success: torch.gather PR has been raised and will be merged.
        #   Once merged, CI must pass these tests. Mark as mandatory_success now so
        #   CI immediately validates the implementation when the PR lands.
        #
        # Upstream dtype coverage:
        #   test_gather            @dtypes(float32, complex64)  — complex64 excluded (not Spyre supported)
        #   test_gather_large      @dtypes(int8, bfloat16)      — int8 excluded; bfloat16 runs
        #   test_gather_bool       @dtypes(bool)                — bool runs
        #   test_gather_expanded_index @dtypes(float32, float64, bfloat16) — float64 excluded; @onlyCPU
        #
        # Note on @onlyCPU (test_gather_expanded_index):
        #   @onlyCPU does NOT prevent instantiation for privateuse1 — the variant IS
        #   collected and executed on Spyre. Once gather is implemented, this test
        #   exercises the expanded-index fast path and must pass.
        - names:
            - TestScatterGather::test_gather
            - TestScatterGather::test_gather_large
            - TestScatterGather::test_gather_bool
            - TestScatterGather::test_gather_expanded_index
          mode: mandatory_success

        # torch.scatter / torch.scatter_
        # Writes src values into self at positions specified by an index tensor.
        # xfail: torch.scatter is not yet implemented on Spyre (Q2 scope: torch.gather only).
        #
        # Upstream dtype coverage (excluded dtypes noted):
        #   test_scatter_           @dtypes(float16, float32, complex64)  — complex64 excluded
        #   test_scatter__scalar    @dtypes(float16, float32, complex64)  — complex64 excluded
        #   test_scatter__reductions @dtypes(float16, float32, complex64); @dtypesIfCUDA(float16, float32)
        #                            — complex64 excluded; on privateuse1 full @dtypes applies
        #   test_scatter_expanded_index @dtypes(float32, float64, bfloat16, float16); @onlyCPU
        #                            — float64 excluded; @onlyCPU does NOT skip on Spyre
        - names:
            - TestScatterGather::test_scatter_
            - TestScatterGather::test_scatter__scalar
            - TestScatterGather::test_scatter__reductions
            - TestScatterGather::test_scatter_expanded_index
          mode: xfail

        # torch.scatter_add / torch.scatter_add_
        # Accumulates src values into self at positions specified by an index tensor.
        # xfail: torch.scatter_add is not yet implemented on Spyre.
        #
        # Upstream dtype coverage:
        #   test_scatter_add_       @dtypes(float16, float32, complex64)  — complex64 excluded
        #   test_scatter_add_mult_index_base @dtypes(float32)             — float32 only
        #   test_scatter_add_broadcasted_index_deterministic @dtypes(float32) — float32 only
        - names:
            - TestScatterGather::test_scatter_add_
            - TestScatterGather::test_scatter_add_mult_index_base
            - TestScatterGather::test_scatter_add_broadcasted_index_deterministic
          mode: xfail

        # torch.scatter_reduce / torch.scatter_reduce_
        # Reduce-mode scatter: sum, prod, mean, amax, amin.
        # xfail: torch.scatter_reduce is not yet implemented on Spyre.
        #
        # Upstream dtype coverage (all use get_all_dtypes variants; excluded noted):
        #   test_scatter_reduce_sum   all except bool       — float16, float32, int64, bfloat16 run
        #   test_scatter_reduce_prod  all (CUDA: excl complex+bool) — float16, float32, int64, bfloat16, bool run
        #   test_scatter_reduce_mean  all except bool       — float16, float32, int64, bfloat16 run
        #   test_scatter_reduce_amax  all except complex    — float16, float32, int64, bfloat16, bool run
        #   test_scatter_reduce_amin  all except complex    — float16, float32, int64, bfloat16, bool run
        #   Excluded from all: complex64, complex128, float64, int8, int16, int32, uint8 (not in supported_dtypes)
        - names:
            - TestScatterGather::test_scatter_reduce_sum
            - TestScatterGather::test_scatter_reduce_prod
            - TestScatterGather::test_scatter_reduce_mean
            - TestScatterGather::test_scatter_reduce_amax
            - TestScatterGather::test_scatter_reduce_amin
          mode: xfail

  global:
    supported_dtypes:
      # -----------------------------------------------------------------------
      # Active dtypes — run on Spyre today
      # -----------------------------------------------------------------------
      - name: float16
        description: Spyre primary dtype. Required by scatter_ / scatter_add_ / scatter_reduce
          tests that use @dtypes(float16, float32, ...).
      - name: float32
        description: Required for test_gather (@dtypes(float32, complex64)),
          test_scatter_add_mult_index_base and test_scatter_add_broadcasted_index_deterministic
          (@dtypes(float32)), and test_gather_expanded_index (@dtypes(float32, float64, bfloat16)).
      - name: int64
        description: Covered by scatter_reduce get_all_dtypes set and needed for integer
          index tensors throughout the test body.
      - name: bfloat16
        description: Required for test_gather_large (@dtypes(int8, bfloat16)) and scatter_reduce
          get_all_dtypes set.
      - name: bool
        description: Required for test_gather_bool (@dtypes(bool)), test_scatter_reduce_prod/amax/amin
          (get_all_dtypes includes bool). Also prevents extract_dtype_from_name from filtering
          tests whose names contain "bool".
      # -----------------------------------------------------------------------
      # Excluded dtypes — present in upstream @dtypes but NOT yet supported on Spyre.
      # Uncomment each entry when Spyre adds support for that dtype.
      # -----------------------------------------------------------------------
      # - name: float64    # upstream: test_gather_expanded_index @dtypes(float32,float64,bfloat16);
      #                    #   test_scatter_expanded_index @dtypes(float32,float64,bfloat16,float16);
      #                    #   scatter_reduce get_all_dtypes set.
      #                    # reason: Spyre maximum floating-point precision is float32.
      # - name: int8       # upstream: test_gather_large @dtypes(int8, bfloat16);
      #                    #   scatter_reduce get_all_dtypes set.
      #                    # reason: 8-bit integer ops not supported on Spyre.
      # - name: int16      # upstream: scatter_reduce get_all_dtypes set.
      #                    # reason: 16-bit integer ops not supported on Spyre.
      # - name: int32      # upstream: scatter_reduce get_all_dtypes set.
      #                    # reason: 32-bit integer ops not supported on Spyre.
      # - name: uint8      # upstream: scatter_reduce get_all_dtypes set.
      #                    # reason: unsigned integer ops not supported on Spyre.
      # - name: complex64  # upstream: test_gather @dtypes(float32, complex64);
      #                    #   test_scatter_ / test_scatter_add_ @dtypes(float16, float32, complex64);
      #                    #   scatter_reduce get_all_dtypes (include_complex=True variants).
      #                    # reason: complex arithmetic not supported on Spyre.
      # - name: complex128 # upstream: scatter_reduce get_all_dtypes (test_scatter_reduce_prod
      #                    #   on non-CUDA uses full get_all_dtypes including complex128).
      #                    # reason: complex arithmetic not supported on Spyre.
